# One-shot(ish) bootstrap: opens a PR against every repo in
# config/copilot-review-repos.json missing a pr-build-zip.yml caller, with
# auto-detected build settings. Manual dispatch only (unlike
# propagate-copilot-review.yml's weekly schedule) -- a human should review
# each auto-detected build-command/zip-glob PR rather than have it appear
# silently on a timer.
name: Propagate PR build ZIP workflow

on:
  workflow_dispatch:

jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Propagate
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_TOKEN_THEMEGRILL: ${{ secrets.BOT_TOKEN_THEMEGRILL }}
        run: node scripts/propagate-pr-build-zip.mjs
