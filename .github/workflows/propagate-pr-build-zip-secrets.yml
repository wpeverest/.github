name: Propagate pr-build-zip secrets to all repos

on:
  workflow_dispatch:

jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - name: Propagate
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_TOKEN_THEMEGRILL: ${{ secrets.BOT_TOKEN_THEMEGRILL }}
          ARTIFACTS_KEY: ${{ secrets.ARTIFACTS_KEY }}
          ARTIFACTS_SECRET: ${{ secrets.ARTIFACTS_SECRET }}
        run: node scripts/propagate-pr-build-zip-secrets.mjs
