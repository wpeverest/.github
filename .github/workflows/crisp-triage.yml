# Phase 2: Crisp -> AI -> GitHub issue.
#
# Hourly: fetch resolved Crisp conversations since the last run, cheaply
# classify each (Stage 1), then for anything actionable, check out the mapped
# repo and let an agent (OpenCode CLI) investigate, dedupe against existing
# issues, file a new one, or leave a note in the Crisp conversation if it
# turns out not to be a real product defect (Stage 2).
#
# No server: Stage 2's `opencode run` is a blocking CLI call inside the job,
# not a persistent process -- same zero-infra pattern as Phase 1.
name: Crisp triage

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

concurrency:
  group: crisp-triage
  cancel-in-progress: false # never cancel a mid-flight triage run

jobs:
  classify:
    name: Fetch and classify conversations
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.classify.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # This repo lives in themegrill, so only the themegrill-scoped
          # token can write to it (needed to commit the advanced cursor).
          # BOT_TOKEN (below) is for reaching wpeverest product repos instead.
          token: ${{ secrets.BOT_TOKEN_THEMEGRILL }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Classify
        id: classify
        env:
          # One credential triple per Crisp account -- see config/inbox-to-repo.json
          # for the account-key-to-repo mapping. Add a triple here when
          # onboarding a new account (see the onboard-crisp-account skill).
          CRISP_USER_REGISTRATION_IDENTIFIER: ${{ secrets.CRISP_USER_REGISTRATION_IDENTIFIER }}
          CRISP_USER_REGISTRATION_KEY: ${{ secrets.CRISP_USER_REGISTRATION_KEY }}
          CRISP_USER_REGISTRATION_WEBSITE_ID: ${{ vars.CRISP_USER_REGISTRATION_WEBSITE_ID }}
          CRISP_EVEREST_FORMS_IDENTIFIER: ${{ secrets.CRISP_EVEREST_FORMS_IDENTIFIER }}
          CRISP_EVEREST_FORMS_KEY: ${{ secrets.CRISP_EVEREST_FORMS_KEY }}
          CRISP_EVEREST_FORMS_WEBSITE_ID: ${{ vars.CRISP_EVEREST_FORMS_WEBSITE_ID }}
          CRISP_THEMEGRILL_IDENTIFIER: ${{ secrets.CRISP_THEMEGRILL_IDENTIFIER }}
          CRISP_THEMEGRILL_KEY: ${{ secrets.CRISP_THEMEGRILL_KEY }}
          CRISP_THEMEGRILL_WEBSITE_ID: ${{ vars.CRISP_THEMEGRILL_WEBSITE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Verify against platform.openai.com/docs/models before trusting this default.
          CLASSIFY_MODEL: ${{ vars.CLASSIFY_MODEL || 'gpt-5-mini' }}
        run: |
          node scripts/crisp-classify.mjs
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

      # Separate from the resolved-conversation pipeline above: never files a
      # new issue, only flags a match against an already-open one -- safe to
      # run on a conversation that isn't finished yet, unlike full investigation.
      - name: Check active conversations for duplicates
        env:
          CRISP_USER_REGISTRATION_IDENTIFIER: ${{ secrets.CRISP_USER_REGISTRATION_IDENTIFIER }}
          CRISP_USER_REGISTRATION_KEY: ${{ secrets.CRISP_USER_REGISTRATION_KEY }}
          CRISP_USER_REGISTRATION_WEBSITE_ID: ${{ vars.CRISP_USER_REGISTRATION_WEBSITE_ID }}
          CRISP_EVEREST_FORMS_IDENTIFIER: ${{ secrets.CRISP_EVEREST_FORMS_IDENTIFIER }}
          CRISP_EVEREST_FORMS_KEY: ${{ secrets.CRISP_EVEREST_FORMS_KEY }}
          CRISP_EVEREST_FORMS_WEBSITE_ID: ${{ vars.CRISP_EVEREST_FORMS_WEBSITE_ID }}
          CRISP_THEMEGRILL_IDENTIFIER: ${{ secrets.CRISP_THEMEGRILL_IDENTIFIER }}
          CRISP_THEMEGRILL_KEY: ${{ secrets.CRISP_THEMEGRILL_KEY }}
          CRISP_THEMEGRILL_WEBSITE_ID: ${{ vars.CRISP_THEMEGRILL_WEBSITE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLASSIFY_MODEL: ${{ vars.CLASSIFY_MODEL || 'gpt-5-mini' }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_TOKEN_THEMEGRILL: ${{ secrets.BOT_TOKEN_THEMEGRILL }}
        run: node scripts/crisp-dedupe-active.mjs

      # Retries on a non-fast-forward push: master can move between this
      # job's checkout and this step. `-X ours` auto-resolves any conflict by
      # keeping this run's own state -- correct for cursor.json (latest
      # timestamp should win), and an acceptable tradeoff elsewhere (a rare
      # lost entry just gets re-checked next run, not lost forever). `set +e`
      # matters: bash's default errexit would otherwise abort the whole
      # script on the first conflict instead of retrying.
      - name: Commit advanced state
        run: |
          set +e
          git config user.name "tg-autopilot"
          git config user.email "tg-autopilot@users.noreply.github.com"
          git add state/cursor.json state/active-notified.json state/escalated.json state/investigated.json
          git diff --cached --quiet || git commit -m "Advance Crisp triage state [skip ci]"
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (attempt $attempt/5), rebasing onto origin/master (preferring our state on conflict) and retrying..."
            git fetch origin master
            if ! git rebase -X ours origin/master; then
              echo "::error::Rebase failed outright (not just a content conflict) -- aborting"
              git rebase --abort
              exit 1
            fi
          done
          echo "::error::Failed to push advanced state after 5 attempts"
          exit 1

  investigate:
    needs: classify
    if: needs.classify.outputs.matrix != '[]'
    uses: ./.github/workflows/crisp-investigate-job.yml
    with:
      matrix: ${{ needs.classify.outputs.matrix }}
    secrets: inherit
