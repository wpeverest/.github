# TEMPLATE -- copy into a consuming repo as
# .github/workflows/copilot-review-on-comment.yml
#
# `secrets: inherit` looks like it should work here but doesn't for a
# themegrill repo -- it only inherits secrets when the caller and the
# reusable workflow are in the SAME organization. themegrill/.github lives in
# wpeverest, so a themegrill caller needs the secret passed explicitly by
# name instead, which works across the org boundary. Confirmed for real:
# every themegrill repo failed identically ("Secret BOT_TOKEN is required,
# but not provided while calling") until switched to this explicit form.
name: Copilot review on comment

on:
  pull_request_target:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  review:
    uses: themegrill/.github/.github/workflows/copilot-review-on-comment.yml@master
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
