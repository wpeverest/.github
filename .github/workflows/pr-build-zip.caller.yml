# TEMPLATE -- copy into a consuming repo as .github/workflows/pr-build-zip.yml
# and adjust build-command / zip-glob / branches to that repo's tooling.
name: Build Testable ZIP

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop]
  workflow_dispatch:

jobs:
  zip:
    uses: wpeverest/.github/.github/workflows/pr-build-zip.yml@master
    with:
      node-version: '20.x'
      php-version: '7.4'
      build-command: yarn build && yarn build:blocks && gulp release
      zip-glob: 'release/*.zip'
      artifacts-bucket: themegrill-pr-artifacts
      public-base-url: https://themegrill-pr-artifacts.s3.amazonaws.com
      s3-region: us-east-1
      # For Cloudflare R2, use instead:
      # s3-endpoint: https://<account-id>.r2.cloudflarestorage.com
      # s3-region: auto
    secrets: inherit
