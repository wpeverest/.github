# TEMPLATE -- copy into a consuming repo as .github/workflows/pr-build-zip.yml
# and adjust build-command / zip-glob / branches to that repo's tooling.
name: Build Testable ZIP

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop]
  workflow_dispatch:

jobs:
  zip:
    uses: wpeverest/.github/.github/workflows/pr-build-zip.yml@main
    with:
      node-version: '20.x'
      php-version: '7.4'
      build-command: yarn build && yarn build:blocks && gulp release
      zip-glob: 'release/*.zip'
      public-base-url: https://artifacts.themegrill.com
      # For Cloudflare R2, also set:
      # s3-endpoint: https://<account-id>.r2.cloudflarestorage.com
      # s3-region: auto
    secrets: inherit
