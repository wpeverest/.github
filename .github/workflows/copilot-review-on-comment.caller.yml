# TEMPLATE -- copy into a consuming repo as
# .github/workflows/copilot-review-on-comment.yml
#
# `secrets: inherit` looks like it should work but doesn't for a themegrill
# repo: it only inherits within the same org, and themegrill/.github lives in
# wpeverest. Pass the secret explicitly by name instead, as below.
name: Copilot review on comment

on:
  pull_request_target:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  review:
    uses: themegrill/.github/.github/workflows/copilot-review-on-comment.yml@master
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
