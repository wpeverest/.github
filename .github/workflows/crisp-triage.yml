# Phase 2: Crisp -> AI -> GitHub issue.
#
# Hourly: fetch resolved Crisp conversations since the last run, cheaply
# classify each (Stage 1), then for anything actionable, check out the mapped
# repo and let an agent (OpenCode CLI) investigate, dedupe against existing
# issues, file a new one, or leave a note in the Crisp conversation if it
# turns out not to be a real product defect (Stage 2).
#
# No server: Stage 2's `opencode run` is a blocking CLI call inside the job,
# not a persistent process -- same zero-infra pattern as Phase 1.
name: Crisp triage

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: crisp-triage
  cancel-in-progress: false # never cancel a mid-flight triage run

jobs:
  classify:
    name: Fetch and classify conversations
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.classify.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN }} # needs contents:write here to commit the advanced cursor

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Classify
        id: classify
        env:
          # Two separate Crisp accounts (different logins), each with its own
          # credential set -- see config/inbox-to-repo.json for how the
          # account keys below (USER_REGISTRATION, THEMEGRILL) map to repos.
          # Add a new triple here whenever a new Crisp account is onboarded.
          CRISP_USER_REGISTRATION_IDENTIFIER: ${{ secrets.CRISP_USER_REGISTRATION_IDENTIFIER }}
          CRISP_USER_REGISTRATION_KEY: ${{ secrets.CRISP_USER_REGISTRATION_KEY }}
          CRISP_USER_REGISTRATION_WEBSITE_ID: ${{ vars.CRISP_USER_REGISTRATION_WEBSITE_ID }}
          CRISP_THEMEGRILL_IDENTIFIER: ${{ secrets.CRISP_THEMEGRILL_IDENTIFIER }}
          CRISP_THEMEGRILL_KEY: ${{ secrets.CRISP_THEMEGRILL_KEY }}
          CRISP_THEMEGRILL_WEBSITE_ID: ${{ vars.CRISP_THEMEGRILL_WEBSITE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Verify against platform.openai.com/docs/models before trusting this default.
          CLASSIFY_MODEL: ${{ vars.CLASSIFY_MODEL || 'gpt-5-mini' }}
        run: |
          node scripts/crisp-classify.mjs
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

      # Separate from the resolved-conversation pipeline above: never files a
      # new issue, only flags a match against an already-open one -- safe to
      # run on a conversation that isn't finished yet, unlike full investigation.
      - name: Check active conversations for duplicates
        env:
          CRISP_USER_REGISTRATION_IDENTIFIER: ${{ secrets.CRISP_USER_REGISTRATION_IDENTIFIER }}
          CRISP_USER_REGISTRATION_KEY: ${{ secrets.CRISP_USER_REGISTRATION_KEY }}
          CRISP_USER_REGISTRATION_WEBSITE_ID: ${{ vars.CRISP_USER_REGISTRATION_WEBSITE_ID }}
          CRISP_THEMEGRILL_IDENTIFIER: ${{ secrets.CRISP_THEMEGRILL_IDENTIFIER }}
          CRISP_THEMEGRILL_KEY: ${{ secrets.CRISP_THEMEGRILL_KEY }}
          CRISP_THEMEGRILL_WEBSITE_ID: ${{ vars.CRISP_THEMEGRILL_WEBSITE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLASSIFY_MODEL: ${{ vars.CLASSIFY_MODEL || 'gpt-5-mini' }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_TOKEN_THEMEGRILL: ${{ secrets.BOT_TOKEN_THEMEGRILL }}
        run: node scripts/crisp-dedupe-active.mjs

      # Retries on a non-fast-forward push: master can move between this
      # job's checkout and this step (e.g. an unrelated PR merging, or another
      # run of this same workflow, in the meantime) -- observed for real, both
      # as a clean divergence AND as a genuine content conflict on
      # state/cursor.json's single timestamp line. `-X ours` auto-resolves any
      # conflict by keeping this run's own state, which is the right call for
      # cursor.json (we want the latest run's timestamp to win) and an
      # acceptable tradeoff for active-notified.json (a rare lost entry from a
      # concurrent run just gets re-checked and re-notified later, not lost
      # forever). Steps here must not rely on bash's default errexit (`-e`,
      # which GitHub Actions bash steps run with) to stop the loop -- a
      # failing git command inside the loop needs to be handled explicitly,
      # or errexit kills the whole script on the FIRST conflict instead of
      # retrying, which is exactly what happened before this fix.
      - name: Commit advanced state
        run: |
          set +e
          git config user.name "tg-autopilot"
          git config user.email "tg-autopilot@users.noreply.github.com"
          git add state/cursor.json state/active-notified.json state/escalated.json
          git diff --cached --quiet || git commit -m "Advance Crisp triage state [skip ci]"
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (attempt $attempt/5), rebasing onto origin/master (preferring our state on conflict) and retrying..."
            git fetch origin master
            if ! git rebase -X ours origin/master; then
              echo "::error::Rebase failed outright (not just a content conflict) -- aborting"
              git rebase --abort
              exit 1
            fi
          done
          echo "::error::Failed to push advanced state after 5 attempts"
          exit 1

  investigate:
    name: Investigate (${{ matrix.session_id }})
    needs: classify
    if: needs.classify.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Capped, not unlimited: every job shares one org-wide OpenAI TPM budget
      # (500k/min for gpt-5-mini), so a large matrix firing all at once burns
      # through it fast. Confirmed for real -- a run with ~10 concurrent jobs
      # already hit 429s repeatedly, and some jobs never recovered (see the
      # "Investigate and act" step's own retry-detection below). Capping
      # concurrency doesn't eliminate rate limiting, just makes it rarer.
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.classify.outputs.matrix) }}
    steps:
      - name: Check out bot tooling
        uses: actions/checkout@v4
        with:
          path: .bot-tools

      # tg-autopilot's fine-grained PAT is scoped to ONE resource owner --
      # BOT_TOKEN covers wpeverest, BOT_TOKEN_THEMEGRILL covers themegrill.
      # Pick whichever matches this conversation's target repo's org.
      - name: Check out target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ startsWith(matrix.repo, 'themegrill/') && secrets.BOT_TOKEN_THEMEGRILL || secrets.BOT_TOKEN }}
          path: workspace

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenCode CLI
        run: npm install -g opencode-ai

      # $HOME, not /tg-autopilot: the runner user can't write to filesystem
      # root ("mkdir: cannot create directory '/tg-autopilot': Permission
      # denied"). $HOME is always writable and still outside the repo tree.
      # crisp-post-note.mjs does `import { postNote } from "./crisp-client.mjs"`
      # -- a relative import that needs crisp-client.mjs sitting right next
      # to it here too, not just in its original scripts/ folder. Missing
      # this broke the note-back step for real (ERR_MODULE_NOT_FOUND),
      # though the agent noticed and reported it rather than failing silently.
      - name: Place Crisp note-posting helper (kept outside the repo tree, no name collision)
        run: |
          mkdir -p "$HOME/tg-autopilot"
          cp .bot-tools/scripts/crisp-post-note.mjs "$HOME/tg-autopilot/crisp-post-note.mjs"
          cp .bot-tools/scripts/crisp-client.mjs "$HOME/tg-autopilot/crisp-client.mjs"

      - name: Re-fetch this conversation's transcript
        id: transcript
        env:
          # Dynamic lookup by matrix.account (e.g. "USER_REGISTRATION") --
          # each conversation's matrix entry says which Crisp account it came
          # from, so we resolve that account's specific credentials here
          # rather than assuming a single global Crisp account.
          CRISP_IDENTIFIER: ${{ secrets[format('CRISP_{0}_IDENTIFIER', matrix.account)] }}
          CRISP_KEY: ${{ secrets[format('CRISP_{0}_KEY', matrix.account)] }}
          CRISP_WEBSITE_ID: ${{ vars[format('CRISP_{0}_WEBSITE_ID', matrix.account)] }}
        run: |
          node .bot-tools/scripts/crisp-fetch-transcript.mjs "${{ matrix.session_id }}" > transcript.txt
          echo "path=$PWD/transcript.txt" >> "$GITHUB_OUTPUT"

      - name: Build the agent prompt
        id: prompt
        env:
          # Confirmed working (see conversationUrl() in scripts/crisp-client.mjs,
          # which this duplicates since it's simple string interpolation that
          # doesn't need the shared module loaded into a YAML step).
          CONVERSATION_URL: https://app.crisp.chat/website/${{ vars[format('CRISP_{0}_WEBSITE_ID', matrix.account)] }}/inbox/${{ matrix.session_id }}/
        run: |
          node .bot-tools/scripts/build-prompt.mjs \
            .bot-tools/prompts/crisp-triage-agent.md \
            "${{ matrix.repo }}" "${{ matrix.kind }}" "${{ matrix.session_id }}" "$CONVERSATION_URL" "${{ steps.transcript.outputs.path }}" \
            > prompt.md
          echo "path=$PWD/prompt.md" >> "$GITHUB_OUTPUT"

      # OpenCode's env-var auto-detection is only confirmed (in their docs)
      # for Anthropic. For OpenAI, write an explicit provider config using the
      # same `{env:VAR}` substitution syntax that IS documented, rather than
      # assume auto-detection also covers it.
      - name: Configure OpenCode's OpenAI provider
        working-directory: workspace
        run: |
          cat > opencode.json <<'JSON'
          {
            "provider": {
              "openai": {
                "options": { "apiKey": "{env:OPENAI_API_KEY}" }
              }
            }
          }
          JSON

      # opencode's CLI can exit 0 even when it never finished the task -- seen
      # for real: a mid-investigation OpenAI rate-limit (429) error with no
      # further retry, no issue filed, no Crisp note posted, yet the step
      # still reported success. The prompt's own rule 5 ("always leave a note
      # back... this step runs every time, no exceptions") gives a concrete,
      # checkable signal: if the transcript of tool calls never actually
      # invokes crisp-post-note.mjs, the agent didn't complete its mandatory
      # last step, regardless of what exit code it returned -- fail the step
      # so this shows up instead of silently vanishing.
      - name: Investigate and act
        working-directory: workspace
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ startsWith(matrix.repo, 'themegrill/') && secrets.BOT_TOKEN_THEMEGRILL || secrets.BOT_TOKEN }}
          CRISP_IDENTIFIER: ${{ secrets[format('CRISP_{0}_IDENTIFIER', matrix.account)] }}
          CRISP_KEY: ${{ secrets[format('CRISP_{0}_KEY', matrix.account)] }}
          CRISP_WEBSITE_ID: ${{ vars[format('CRISP_{0}_WEBSITE_ID', matrix.account)] }}
        run: |
          set +e
          opencode run "$(cat "${{ steps.prompt.outputs.path }}")" \
            --model "openai/${{ vars.INVESTIGATE_MODEL || 'gpt-5-mini' }}" \
            --auto \
            --format json \
            | tee "$GITHUB_STEP_SUMMARY" > /tmp/opencode-output.json
          if ! grep -q "crisp-post-note.mjs" /tmp/opencode-output.json; then
            echo "::error::Agent never called crisp-post-note.mjs -- it did not complete its mandatory last step (likely died mid-run, e.g. an unrecovered rate limit). Session ${{ matrix.session_id }} was left with no GitHub-side outcome and no note back to the customer."
            exit 1
          fi
